name: ThreeFlow
description: >-
  ThreeFlow (WatchTower Technologies, Inc. dba ThreeFlow) is a benefits
  placement system (BPS) for employee-benefits brokers and insurance carriers,
  bringing quoting, RFPs, analysis, renewals, and presentation into one shared
  workflow. Its ThreeFlow Connect integration layer automates placement data
  flow across broker AMS, carrier, and partner systems. The platform reports
  $3.7B+ premium under management, 450+ broker locations, and 75+ certified
  carriers, and is SOC 2 Type 2 and HITRUST E1 certified. Developer
  documentation is partner-gated; a public status page monitors the Broker
  Portal, Carrier Portal, and API.
